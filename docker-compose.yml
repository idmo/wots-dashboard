# Runs the whole app: Postgres + the Next.js app built from this repo's
# own Dockerfile. Works both for local dev (`docker compose up --build`)
# and as the compose file to run directly on a Docker VPS like Hostinger's.
#
# Override the password via a .env file next to this one (see below) rather
# than editing the hardcoded default — especially before this is reachable
# from the open internet.
#   echo "POSTGRES_PASSWORD=something-long-and-random" > .env
#
# Set SUPERADMIN_EMAIL and SUPERADMIN_PASSWORD in that same .env before the
# first `docker compose up` — that's how the very first staff login gets
# created (see src/instrumentation.ts and .env.example for the rest of the
# auth-related variables).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wots_orders
    # Intentionally NOT publishing 5432 to the host here — the app reaches
    # Postgres over the private compose network via the "db" hostname. If
    # you want to connect a GUI client (e.g. Drizzle Studio, TablePlus)
    # from your own machine, add "ports: [\"5432:5432\"]" back temporarily,
    # or better, tunnel over SSH instead of exposing it publicly.
    volumes:
      - wots_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/wots_orders
      INGRAM_MOCK: "true"
      BASIL_MOCK: "true"
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-wordonthestreetbooks.com}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL_MOCK: ${EMAIL_MOCK:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Word on the Street Books}
    ports:
      - "3000:3000"

  # Runs Drizzle Kit (`db:push`/`db:studio`/etc.) against the same Postgres
  # the app uses. Deliberately built from the Dockerfile's "builder" stage,
  # not the "app" service's image: the app image is Next's trimmed
  # standalone output, which only carries the production dependencies the
  # server actually imports — drizzle-kit is a devDependency and isn't in
  # it. The "builder" stage still has the full node_modules (including
  # devDependencies) and full source needed to run the CLI.
  #
  # Has "profiles: [tools]" so it never starts on a plain `docker compose
  # up` — only when named directly, e.g.:
  #   docker compose run --rm migrate                       # db:push
  #   docker compose run --rm migrate npx drizzle-kit studio
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/wots_orders
    command: ["npx", "drizzle-kit", "push"]

volumes:
  wots_db_data:
